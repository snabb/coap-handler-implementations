[package]
name = "coap-handler-implementations"
version = "0.5.3"

description = "Simple implementations of CoAP handlers"
documentation = "https://docs.rs/coap-handler-implementations/"

rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
coap-message = "0.3.0-alpha.1"
coap-handler = "0.2.0-alpha.1"

serde_cbor = { version = "0.11", default-features = false }
serde = { version = "^1.0.69", default-features = false, features = ["derive"] }
windowed-infinity = { version = "^0.1.8", features = [ "with_serde_cbor", "with_minicbor_0_19", "with_minicbor_0_24", "with_minicbor_0_26", "with_ciborium", "with_embedded_io_0_4" ] }
crc = { version = "^3", default-features = false }
coap-numbers = { version = "^0.2.2", default-features = false }

# For the typed_resource versions
minicbor_0_19 = { package = "minicbor", version = "0.19", default-features = false }
minicbor_0_24 = { package = "minicbor", version = "0.24.4", default-features = false }
minicbor_0_26 = { package = "minicbor", version = "0.26", default-features = false }
ciborium-io = { version = "0.2", default-features = false }

embedded-io = "0.4"

document-features = "0.2"

coap-message-utils = { version = "0.3.0", path = "../coap-message-utils" }

[features]
#! ## Feature flags

## Make a few items pub available that do not have stability guarantees.
## While this is useful in the context of building handlers into statics,
## apply the same caution as with any other crate feature that's
## disabling stability guarantees: Don't use this from libraries, for
## your dependents will run the risk of accidentally using unstable names.
leaky_names = []

## This crate has nothing in terms of std to activate, but due to serde's
## non-additive std feature that extends down to serde_cbor, a user may need to
## declare that serde's std feature is used just so that all serde implementers
## are instructed to properly switch on their std as well.
serde-std = [ "serde_cbor/std", "serde/std" ]

# Experimental feature from before RPITIT (in Rust 1.75); to be removed as the
# explicitly typed returns are replaced with impl Trait returns.
_nontrivial_option_processing = []

_nightly_docs = []

[badges]
maintenance = { status = "actively-developed" }

[package.metadata.docs.rs]
all-features = true
